# which branch to trigger the workflow on
name: Deploy Node.js App to ExCloud Server
on:
  push:
    branches:
      - main

# steps 
jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and push
        run: |
          docker build -t gaurav0973/maurya-devops .
          docker push gaurav0973/maurya-devops
        

      - name: Deploy on ExCloud Server
        uses: appleboy/ssh-action@v1.2.5
        with: 
          host: 210.79.129.202
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /home/ubuntu/DevOps
            git pull 
            npm install
            pm2 delete index || true
            pm2 start index.js --name index

