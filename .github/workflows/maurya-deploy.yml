# which branch to trigger the workflow on
name: Deploy Node.js App to ExCloud Server
on:
  push:
    branches:
      - main

# steps 
jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and push
        run: |
          docker build -t gaurav0973/maurya-devops .
          docker push gaurav0973/maurya-devops
        

      - name: Deploy on ExCloud Server
        uses: appleboy/ssh-action@v1.2.5
        with: 
          host: 210.79.129.202
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # CD /home/ubuntu/DevOps
            cd /home/ubuntu/DevOps

            # git pull 
            git pull origin main

            # make sure to pull a fresh copy of gaurav0973/maurya-devops
            sudo docker compose pull

            # docker compose up -d 
            sudo docker compose up -d

            # prune unused images
            sudo docker image prune -f

