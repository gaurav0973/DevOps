services:
  node-js-server:
    image: gaurav0973/maurya-devops
    container_name: node-js-server
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - maurya-devops-internal

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node-js-server
    networks:
      - maurya-devops-internal

networks:
  maurya-devops-internal:
    driver: bridge
  
volumes:
  caddy_data:
